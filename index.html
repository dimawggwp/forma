    if (plan.id) { const p = this.d.plans.find(x => x.id === plan.id && x.owner_id === this.meId); if (p) { Object.assign(p, clean, { updated_at: now }); this.persist(); return p; } }
    const p = { id: uid(), owner_id: this.meId, created_at: now, updated_at: now, ...clean }; this.d.plans.push(p); this.persist(); return p; },
  async deletePlan(id){ this.d.plans = this.d.plans.filter(p => !(p.id === id && p.owner_id === this.meId)); this.persist(); },
  async logWorkout(l){ const x = { id: uid(), user_id: this.meId, created_at: new Date().toISOString(), ...l }; this.d.logs.push(x); this.persist(); return x; },
  async myLogs(n = 60){ return this.d.logs.filter(l => l.user_id === this.meId).sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, n); },

  async meals(day){ return this.d.meals.filter(m => m.user_id === this.meId && m.day === day).sort((a, b) => a.created_at.localeCompare(b.created_at)); },
  async mealsRange(days){ const set = new Set(days); return this.d.meals.filter(m => m.user_id === this.meId && set.has(m.day)); },
  async addMeal(m){ const x = { id: uid(), user_id: this.meId, created_at: new Date().toISOString(), ...m }; this.d.meals.push(x); this.persist(); return x; },
  async deleteMeal(id){ this.d.meals = this.d.meals.filter(m => m.id !== id); this.persist(); },
  async water(day){ return this.d.water[day] || 0; },
  async setWater(day, ml){ this.d.water[day] = Math.max(0, ml); this.persist(); },
  async weights(n = 30){ return this.d.weights.filter(w => w.user_id === this.meId).sort((a, b) => a.day.localeCompare(b.day)).slice(-n); },
  async addWeight(kg){ const day = todayStr(); const w = this.d.weights.find(x => x.user_id === this.meId && x.day === day); if (w) w.kg = kg; else this.d.weights.push({ id: uid(), user_id: this.meId, day, kg }); const p = this.prof(this.meId); p.weight_kg = kg; this.persist(); },

  async aiHistory(){ return this.d.ai.slice(-80); },
  async aiSave(role, content){ this.d.ai.push({ id: uid(), role, content, created_at: new Date().toISOString() }); if (this.d.ai.length > 200) this.d.ai = this.d.ai.slice(-200); this.persist(); },
  async aiClear(){ this.d.ai = []; this.persist(); },
  async aiCoach(){ return null; },     // no server in demo → local engine
  async foodScan(){ return null; },

  async notifications(){ return this.d.notifs.filter(n => n.user_id === this.meId).slice(0, 60).map(n => ({ ...n, actor: this.prof(n.actor_id), post: n.post_id ? this.d.posts.find(p => p.id === n.post_id) : null })); },
  async markNotifsRead(){ this.d.notifs.forEach(n => { if (n.user_id === this.meId) n.read = true; }); this.persist(); },
  async unread(){ return { notif: this.d.notifs.filter(n => n.user_id === this.meId && !n.read).length, dm: this.d.messages.filter(m => m.recipient_id === this.meId && !m.read_at).length }; },

  async materials(){ return [...this.d.materials].sort((a, b) => (b.pinned - a.pinned) || b.created_at.localeCompare(a.created_at)).map(m => ({ ...m, author: this.prof(m.author_id) })); },
  async addMaterial(m, file, onProgress, thumb){
    const me = this.prof(this.meId); if (me.role !== "admin") throw new Error(t("mat_only_admin"));
    const id = uid(); const rec = { id, author_id: this.meId, created_at: new Date().toISOString(), pinned: false, ...m };
    if (file) { onProgress && onProgress(.3); await BlobStore.put("idb:" + id, file); rec.storage_path = "idb:" + id; rec.mime = file.type; rec.size_bytes = file.size; onProgress && onProgress(1); }
    if (thumb) { await BlobStore.put("idb:t-" + id, thumb); rec.thumb_url = "idb:t-" + id; }
    this.d.materials.push(rec); this.persist(); return rec; },
  async updateMaterial(id, patch){ const m = this.d.materials.find(x => x.id === id); if (m) Object.assign(m, patch); this.persist(); return m; },
  async deleteMaterial(m){ if (m.storage_path) await BlobStore.del(m.storage_path); if (m.thumb_url && m.thumb_url.startsWith("idb:")) await BlobStore.del(m.thumb_url); this.d.materials = this.d.materials.filter(x => x.id !== m.id); this.persist(); },
  async materialUrl(m){ if (m.url && m.kind === "link") return m.url; if (m.storage_path && m.storage_path.startsWith("idb:")) return BlobStore.url(m.storage_path); return m.url || ""; },
  async linkPreview(url){ return basicPreview(url); },
  async uploadImage(file){ const c = await compressImage(file, 1080, .8); return c.dataUrl; },
};
function trendingFrom(texts){ const c = new Map(); texts.forEach(s => (s.match(/#[\p{L}\p{N}_]{2,30}/gu) || []).forEach(h => { h = h.toLowerCase(); c.set(h, (c.get(h) || 0) + 1); })); return [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([tag, n]) => ({ tag, n })); }

/* ------------------------------ Remote (Supabase) backend ------------------------------ */
let sb = null;
async function q(promise){ const { data, error } = await promise; if (error) { console.warn(error); throw new Error(error.message || t("err_generic")); } return data; }
const PROFILE_COLS = "id,username,full_name,avatar_url,bio,goal,sex,age,height_cm,weight_kg,activity,lang,verified,onboarded,role,created_at";
const Remote = {
  meId: null, _me: null, _chan: null, listeners: new Set(), profCache: new Map(),
  async init(){ return true; },
  async me(){ if (!this.meId) return null; const p = await q(sb.from("profiles").select(PROFILE_COLS).eq("id", this.meId).maybeSingle()); this._me = p; if (p) this.profCache.set(p.id, p); return p; },
  async updateProfile(patch){ const allowed = ["username", "full_name", "avatar_url", "bio", "goal", "sex", "age", "height_cm", "weight_kg", "activity", "lang", "onboarded"]; const clean = Object.fromEntries(Object.entries(patch).filter(([k]) => allowed.includes(k)));
    if (clean.username && !(await this.usernameFree(clean.username))) throw new Error(t("username_taken"));
    const p = await q(sb.from("profiles").update(clean).eq("id", this.meId).select(PROFILE_COLS).single()); this._me = p; this.profCache.set(p.id, p); return p; },
  async usernameFree(u){ const r = await q(sb.from("profiles").select("id").eq("username", u).maybeSingle()); return !r || r.id === this.meId; },
  async getProfile(id){ if (this.profCache.has(id)) return this.profCache.get(id); const p = await q(sb.from("profiles").select(PROFILE_COLS).eq("id", id).maybeSingle()); if (p) this.profCache.set(id, p); return p; },
  async profiles(ids){ ids = [...new Set(ids)].filter(Boolean); const miss = ids.filter(i => !this.profCache.has(i)); if (miss.length) (await q(sb.from("profiles").select(PROFILE_COLS).in("id", miss))).forEach(p => this.profCache.set(p.id, p)); return ids.map(i => this.profCache.get(i)).filter(Boolean); },
  async getProfileByUsername(u){ const p = await q(sb.from("profiles").select(PROFILE_COLS).eq("username", u).maybeSingle()); if (p) this.profCache.set(p.id, p); return p; },
  async searchProfiles(qs){ qs = qs.replace(/^@/, "").replace(/[%_,()]/g, " ").trim(); if (!qs) return []; return q(sb.from("profiles").select(PROFILE_COLS).or(`username.ilike.%${qs}%,full_name.ilike.%${qs}%`).neq("id", this.meId).limit(20)); },
  async suggested(n = 4){ const fol = (await q(sb.from("follows").select("following_id").eq("follower_id", this.meId))).map(f => f.following_id); fol.push(this.meId);
    return q(sb.from("profiles").select(PROFILE_COLS).not("id", "in", `(${fol.join(",")})`).order("verified", { ascending: false }).order("created_at", { ascending: false }).limit(n)); },

  async hydrate(rows, reposts = []){
    rows = rows.filter(Boolean); if (!rows.length) return [];
    const ids = rows.map(r => r.id); const qids = rows.map(r => r.quote_id).filter(Boolean);
    const [likes, reps, saves, quotes] = await Promise.all([
      q(sb.from("likes").select("post_id").eq("user_id", this.meId).in("post_id", ids)),
      q(sb.from("reposts").select("post_id").eq("user_id", this.meId).in("post_id", ids)),
      q(sb.from("bookmarks").select("post_id").eq("user_id", this.meId).in("post_id", ids)),
      qids.length ? q(sb.from("posts").select("*").in("id", qids)) : [],
    ]);
    await this.profiles([...rows.map(r => r.author_id), ...quotes.map(x => x.author_id), ...reposts.map(r => r.user_id)]);
    const L = new Set(likes.map(x => x.post_id)), R = new Set(reps.map(x => x.post_id)), B = new Set(saves.map(x => x.post_id));
    return rows.map(r => { const via = reposts.find(x => x.post_id === r.id && x._row === r); const qq = quotes.find(x => x.id === r.quote_id);
      return { ...r, author: this.profCache.get(r.author_id), quote: qq ? { ...qq, author: this.profCache.get(qq.author_id) } : null, liked: L.has(r.id), reposted: R.has(r.id), saved: B.has(r.id), repostedBy: via ? this.profCache.get(via.user_id) : null, _sort: via ? via.created_at : r.created_at }; });
  },
  async feed({ mode = "foryou", tag = null, before = null } = {}){
    let qy = sb.from("posts").select("*").is("parent_id", null).order("created_at", { ascending: false }).limit(CONFIG.PAGE);
    if (tag) qy = qy.eq("tag", tag); if (before) qy = qy.lt("created_at", before);
    if (mode !== "following") return this.hydrate(await q(qy));
    const fol = (await q(sb.from("follows").select("following_id").eq("follower_id", this.meId))).map(f => f.following_id);
    const posts = await q(qy.in("author_id", [...fol, this.meId]));
    let reps = []; if (fol.length) { let rq = sb.from("reposts").select("user_id,post_id,created_at").in("user_id", fol).order("created_at", { ascending: false }).limit(CONFIG.PAGE); if (before) rq = rq.lt("created_at", before); reps = await q(rq); }
    const repPosts = reps.length ? await q(sb.from("posts").select("*").in("id", reps.map(r => r.post_id))) : [];
    const rows = [...posts]; const via = [];
    reps.forEach(r => { const p = repPosts.find(x => x.id === r.post_id); if (p && (!tag || p.tag === tag)) { const copy = { ...p }; rows.push(copy); via.push({ ...r, _row: copy }); } });
    const out = await this.hydrate(rows, via); return out.sort((a, b) => b._sort.localeCompare(a._sort)).slice(0, CONFIG.PAGE);
  },
  async getPost(id){ const r = await q(sb.from("posts").select("*").eq("id", id).maybeSingle()); return r ? (await this.hydrate([r]))[0] : null; },
  async replies(id){ return this.hydrate(await q(sb.from("posts").select("*").eq("parent_id", id).order("created_at", { ascending: true }).limit(200))); },
  async userPosts(id, kind = "threads"){
    if (kind === "replies") return this.hydrate(await q(sb.from("posts").select("*").eq("author_id", id).not("parent_id", "is", null).order("created_at", { ascending: false }).limit(40)));
    const own = await q(sb.from("posts").select("*").eq("author_id", id).is("parent_id", null).order("created_at", { ascending: false }).limit(40));
    const reps = await q(sb.from("reposts").select("user_id,post_id,created_at").eq("user_id", id).order("created_at", { ascending: false }).limit(20));
    const rp = reps.length ? await q(sb.from("posts").select("*").in("id", reps.map(r => r.post_id))) : []; const rows = [...own], via = [];
    reps.forEach(r => { const p = rp.find(x => x.id === r.post_id); if (p) { const c = { ...p }; rows.push(c); via.push({ ...r, _row: c }); } });
    return (await this.hydrate(rows, via)).sort((a, b) => b._sort.localeCompare(a._sort));
  },
  async savedPosts(){ const b = await q(sb.from("bookmarks").select("post_id,created_at").eq("user_id", this.meId).order("created_at", { ascending: false }).limit(60)); if (!b.length) return []; const rows = await q(sb.from("posts").select("*").in("id", b.map(x => x.post_id))); const out = await this.hydrate(rows); return b.map(x => out.find(p => p.id === x.post_id)).filter(Boolean); },
  async createPost({ content, tag = null, parent_id = null, quote_id = null, image = null }){
    let image_url = null; if (image) image_url = await this.uploadBlob(image.blob, "posts", "jpg");
    const r = await q(sb.from("posts").insert({ author_id: this.meId, content, tag, parent_id, quote_id, image_url }).select("*").single()); return (await this.hydrate([r]))[0];
  },
  async deletePost(id){ await q(sb.from("posts").delete().eq("id", id).eq("author_id", this.meId)); },
  async toggleLike(post){ if (post.liked) await q(sb.from("likes").delete().eq("user_id", this.meId).eq("post_id", post.id)); else await q(sb.from("likes").insert({ user_id: this.meId, post_id: post.id })); return { ...post, liked: !post.liked, likes_count: Math.max(0, post.likes_count + (post.liked ? -1 : 1)) }; },
  async toggleRepost(post){ if (post.reposted) await q(sb.from("reposts").delete().eq("user_id", this.meId).eq("post_id", post.id)); else await q(sb.from("reposts").insert({ user_id: this.meId, post_id: post.id })); return { ...post, reposted: !post.reposted, reposts_count: Math.max(0, post.reposts_count + (post.reposted ? -1 : 1)) }; },
  async toggleSave(post){ if (post.saved) await q(sb.from("bookmarks").delete().eq("user_id", this.meId).eq("post_id", post.id)); else await q(sb.from("bookmarks").insert({ user_id: this.meId, post_id: post.id })); return { ...post, saved: !post.saved }; },
  async searchPosts(qs){ qs = qs.replace(/[%_]/g, " ").trim(); if (!qs) return []; return this.hydrate(await q(sb.from("posts").select("*").ilike("content", `%${qs}%`).order("created_at", { ascending: false }).limit(30))); },
  async trending(){ const rows = await q(sb.from("posts").select("content").order("created_at", { ascending: false }).limit(300)); return trendingFrom(rows.map(r => r.content)); },

  async follow(id){ if (id === this.meId) return; const { error } = await sb.from("follows").insert({ follower_id: this.meId, following_id: id }); if (error && error.code !== "23505") throw new Error(error.message); },
  async unfollow(id){ await q(sb.from("follows").delete().eq("follower_id", this.meId).eq("following_id", id)); },
  async relation(id){ const [a, b] = await Promise.all([q(sb.from("follows").select("follower_id").eq("follower_id", this.meId).eq("following_id", id)), q(sb.from("follows").select("follower_id").eq("follower_id", id).eq("following_id", this.meId))]); return { following: a.length > 0, followedBy: b.length > 0 }; },
  async counts(id){ const [a, b] = await Promise.all([sb.from("follows").select("*", { count: "exact", head: true }).eq("following_id", id), sb.from("follows").select("*", { count: "exact", head: true }).eq("follower_id", id)]); return { followers: a.count || 0, following: b.count || 0 }; },
  async followList(id, which){ const col = which === "followers" ? "follower_id" : "following_id", key = which === "followers" ? "following_id" : "follower_id"; const rows = await q(sb.from("follows").select(col).eq(key, id).limit(200)); return this.profiles(rows.map(r => r[col])); },
  async friends(){ const [a, b] = await Promise.all([q(sb.from("follows").select("following_id").eq("follower_id", this.meId)), q(sb.from("follows").select("follower_id").eq("following_id", this.meId))]); const back = new Set(b.map(x => x.follower_id)); return this.profiles(a.map(x => x.following_id).filter(i => back.has(i))); },

  async conversations(){ const rows = await q(sb.from("messages").select("*").or(`sender_id.eq.${this.meId},recipient_id.eq.${this.meId}`).order("created_at", { ascending: false }).limit(400)); const by = new Map();
    rows.forEach(m => { const o = m.sender_id === this.meId ? m.recipient_id : m.sender_id; if (!by.has(o)) by.set(o, { otherId: o, last: m, unread: 0 }); if (m.recipient_id === this.meId && !m.read_at) by.get(o).unread++; });
    await this.profiles([...by.keys()]); return [...by.values()].map(c => ({ ...c, other: this.profCache.get(c.otherId) })).filter(c => c.other); },
  async thread(other){ return q(sb.from("messages").select("*").or(`and(sender_id.eq.${this.meId},recipient_id.eq.${other}),and(sender_id.eq.${other},recipient_id.eq.${this.meId})`).order("created_at", { ascending: true }).limit(500)); },
  async sendMessage(other, content){ return q(sb.from("messages").insert({ sender_id: this.meId, recipient_id: other, content }).select("*").single()); },
  async markRead(other){ await sb.from("messages").update({ read_at: new Date().toISOString() }).eq("recipient_id", this.meId).eq("sender_id", other).is("read_at", null); },
  subscribe(fn){ this.listeners.add(fn); this.ensureChannel(); return () => this.listeners.delete(fn); },
  ensureChannel(){ if (this._chan || !this.meId) return; const emit = ev => this.listeners.forEach(f => { try { f(ev); } catch {} });
    this._chan = sb.channel("me-" + this.meId)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `recipient_id=eq.${this.meId}` }, p => emit({ type: "dm", message: p.new }))
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: `user_id=eq.${this.meId}` }, () => emit({ type: "notif" }))
      .on("broadcast", { event: "typing" }, p => emit({ type: "typing", from: p.payload && p.payload.from })).subscribe(); },
  sendTyping(other){ if (!throttleAction("typing-" + other, 2500)) return; try { sb.channel("me-" + other).send({ type: "broadcast", event: "typing", payload: { from: this.meId } }); } catch {} },
  teardown(){ if (this._chan) { sb.removeChannel(this._chan); this._chan = null; } this.listeners.clear(); this.profCache.clear(); },

  async withOwner(rows){ await this.profiles(rows.map(r => r.owner_id)); return rows.map(r => ({ ...r, owner: this.profCache.get(r.owner_id) })); },
  async myPlans(){ return this.withOwner(await q(sb.from("plans").select("*").eq("owner_id", this.meId).order("updated_at", { ascending: false }))); },
  async userPlans(id){ return this.withOwner(await q(sb.from("plans").select("*").eq("owner_id", id).order("updated_at", { ascending: false }))); }, // RLS filters visibility
  async friendsPlans(){ return this.withOwner(await q(sb.from("plans").select("*").neq("owner_id", this.meId).order("updated_at", { ascending: false }).limit(30))); },
  async getPlan(id){ const r = await q(sb.from("plans").select("*").eq("id", id).maybeSingle()); return r ? (await this.withOwner([r]))[0] : null; },
  async savePlan(plan){ const row = { title: plan.title, goal: plan.goal || null, visibility: plan.visibility, days: plan.days, updated_at: new Date().toISOString() };
    if (plan.id) return q(sb.from("plans").update(row).eq("id", plan.id).eq("owner_id", this.meId).select("*").single());
    return q(sb.from("plans").insert({ ...row, owner_id: this.meId }).select("*").single()); },
  async deletePlan(id){ await q(sb.from("plans").delete().eq("id", id).eq("owner_id", this.meId)); },
  async logWorkout(l){ return q(sb.from("workout_logs").insert({ user_id: this.meId, plan_id: l.plan_id && /^[0-9a-f-]{36}$/.test(l.plan_id) ? l.plan_id : null, title: l.title, exercises: l.exercises, duration_sec: l.duration_sec }).select("*").single()); },
  async myLogs(n = 60){ return q(sb.from("workout_logs").select("*").eq("user_id", this.meId).order("created_at", { ascending: false }).limit(n)); },

  async meals(day){ return q(sb.from("meals").select("*").eq("user_id", this.meId).eq("day", day).order("created_at")); },
  async mealsRange(days){ return q(sb.from("meals").select("day,kcal,protein,fat,carbs").eq("user_id", this.meId).in("day", days)); },
  async addMeal(m){ let image_url = m.image_url || null; if (m._blob) image_url = await this.uploadBlob(m._blob, "meals", "jpg"); const { _blob, ...rest } = m; return q(sb.from("meals").insert({ ...rest, image_url, user_id: this.meId }).select("*").single()); },
  async deleteMeal(id){ await q(sb.from("meals").delete().eq("id", id).eq("user_id", this.meId)); },
  async water(day){ const r = await q(sb.from("water_logs").select("ml").eq("user_id", this.meId).eq("day", day).maybeSingle()); return r ? r.ml : 0; },
  async setWater(day, ml){ await q(sb.from("water_logs").upsert({ user_id: this.meId, day, ml: Math.max(0, ml) })); },
  async weights(n = 30){ const r = await q(sb.from("weight_logs").select("day,kg").eq("user_id", this.meId).order("day", { ascending: false }).limit(n)); return r.reverse(); },
  async addWeight(kg){ await q(sb.from("weight_logs").upsert({ user_id: this.meId, day: todayStr(), kg }, { onConflict: "user_id,day" })); await this.updateProfile({ weight_kg: kg }); },

  async aiHistory(){ return (await q(sb.from("ai_messages").select("role,content,created_at").eq("user_id", this.meId).order("created_at", { ascending: false }).limit(80))).reverse(); },
  async aiSave(role, content){ await sb.from("ai_messages").insert({ user_id: this.meId, role, content: content.slice(0, 8000) }); },
  async aiClear(){ await q(sb.from("ai_messages").delete().eq("user_id", this.meId)); },
  async fn(name, body, ms = 30000){ const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), ms);
    try { const { data, error } = await sb.functions.invoke(name, { body, signal: ctl.signal }); if (error) throw error; return data; } finally { clearTimeout(to); } },
  async aiCoach(messages, profile){ try { const d = await this.fn(CONFIG.AI_COACH_FN, { messages: messages.slice(-16), profile: coachProfile(profile), lang: LANG }); return d && d.reply ? d : null; } catch (e) { console.warn("ai-coach", e); return null; } },
  async foodScan(dataUrl){ try { const d = await this.fn(CONFIG.FOOD_SCAN_FN, { image: dataUrl, lang: LANG }, 45000); return d && Array.isArray(d.items) ? d : null; } catch (e) { console.warn("food-scan", e); return null; } },

  async notifications(){ const rows = await q(sb.from("notifications").select("*").eq("user_id", this.meId).order("created_at", { ascending: false }).limit(60)); await this.profiles(rows.map(r => r.actor_id));
    const pids = rows.map(r => r.post_id).filter(Boolean); const posts = pids.length ? await q(sb.from("posts").select("id,content,parent_id").in("id", pids)) : [];

}

// ambient heart-rate line — the brand's signature motion
function pulseCanvas(canvas, { speed = 1, color = "244,244,242", amp = 1 } = {}){
  const ctx = canvas.getContext("2d"); let raf = 0, w = 0, h = 0, x0 = 0, alive = true; const dpr = Math.min(2, devicePixelRatio || 1);
  const beat = u => { u = ((u % 1) + 1) % 1; if (u < .40) return 0; if (u < .44) return -(u - .40) * 4; if (u < .48) return -.16 + (u - .44) * 30; if (u < .53) return 1.04 - (u - .48) * 36; if (u < .57) return -.76 + (u - .53) * 19; if (u < .66) return Math.sin((u - .57) / .09 * Math.PI) * .12; return 0; };
  const resize = () => { const r = canvas.getBoundingClientRect(); w = r.width; h = r.height; canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  const draw = () => {
    if (!alive) return; ctx.clearRect(0, 0, w, h); x0 += 1.4 * speed; const period = Math.max(260, w / 2.4), mid = h * .58, A = Math.min(110, h * .22) * amp;
    for (let layer = 0; layer < 2; layer++) {
      ctx.beginPath(); for (let x = 0; x <= w; x += 2) { const y = mid - beat((x + x0 + layer * period * .37) / period) * A * (layer ? .45 : 1) + (layer ? 40 : 0); x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      const g = ctx.createLinearGradient(0, 0, w, 0); g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(.75, `rgba(${color},${layer ? .12 : .55})`); g.addColorStop(1, `rgba(${color},${layer ? .2 : .95})`);
      ctx.strokeStyle = g; ctx.lineWidth = layer ? 1.2 : 2.2; ctx.lineJoin = "round"; ctx.stroke();
    }
    const hx = w - 2, hy = mid - beat((hx + x0) / period) * A; ctx.beginPath(); ctx.arc(hx, hy, 4, 0, Math.PI * 2); ctx.fillStyle = "rgba(63,214,232,1)"; ctx.shadowColor = "rgba(63,214,232,.9)"; ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;
    raf = requestAnimationFrame(draw);
  };
  resize(); const ro = new ResizeObserver(resize); ro.observe(canvas); draw();
  return () => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); };
}

let authStopArt = null, otpTimer = null;

    <div class="or">${t("or")}</div>
    <form id="emailForm" novalidate>
      ${signup ? `<div class="field"><input class="input" name="name" autocomplete="name" placeholder="${t("name")}" maxlength="60"></div>` : ""}

        <button type="button" class="icon-btn" id="eye" style="position:absolute;right:4px;top:4px" aria-label="show">${icon("eye")}</button></div>
      <div class="err" id="authErr" role="alert"></div>
      <button class="btn btn-white btn-block" type="submit" style="height:52px">${signup ? t("sign_up") : t("sign_in")}</button>
    </form>
    <div class="auth-foot">${signup ? t("have_account") : t("no_account")} <button id="swap">${signup ? t("sign_in") : t("sign_up")}</button>
      ${signup ? "" : `<br><button id="forgot" style="margin-top:10px;color:var(--muted);font-weight:500">${t("forgot")}</button>`}</div>

  $("#emailForm").onsubmit = async e => {

function authPhone(box, { phone = "" } = {}){
  box.innerHTML = `<button class="icon-btn" id="bk" style="margin:-8px 0 12px -10px">${icon("back")}</button><h1>${t("with_phone")}</h1><p class="sub">${LANG === "en" ? "We'll text you a 6-digit code." : "Пришлём SMS с 6‑значным кодом."}</p>

    <div class="err" id="authErr"></div><button class="btn btn-white btn-block" style="height:52px">${t("send_code")}</button></form>`;
  $("#bk").onclick = () => showAuth("main");

  $("#phForm").onsubmit = async e => { e.preventDefault(); const ph = normPhone(e.target.phone.value); if (!isPhone(ph)) return ($("#authErr").textContent = t("err_phone")); if (!Auth.ready) return ($("#authErr").textContent = t("err_backend"));
    const b = $("button", e.target); btnLoading(b, true); try { await Auth.phoneOtp(ph); showAuth("otp", { phone: ph }); } catch (er) { $("#authErr").textContent = authErr(er); btnLoading(b, false); } };
}
function authOtp(box, { phone }){
  box.innerHTML = `<button class="icon-btn" id="bk" style="margin:-8px 0 12px -10px">${icon("back")}</button><h1>${t("verify")}</h1><p class="sub">${t("code_sent")} <b style="color:var(--text)">${esc(phone)}</b></p>
    <div class="otp" id="otp">${Array.from({ length: 6 }, (_, i) => `<input inputmode="numeric" maxlength="1" autocomplete="${i === 0 ? "one-time-code" : "off"}" aria-label="digit ${i + 1}">`).join("")}</div>
    <div class="err" id="authErr" style="margin-top:12px"></div><button class="btn btn-white btn-block" id="vf" style="height:52px">${t("verify")}</button>
    <div class="auth-foot"><button id="rs" disabled style="color:var(--muted)"></button> · <button id="ch">${t("change_number")}</button></div>`;
  const ins = $$("#otp input", box); ins[0].focus();
  ins.forEach((inp, i) => {
    inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, "").slice(-1); if (inp.value && i < 5) ins[i + 1].focus(); if (ins.every(x => x.value)) $("#vf").click(); });
    inp.addEventListener("keydown", e => { if (e.key === "Backspace" && !inp.value && i > 0) ins[i - 1].focus(); });
    inp.addEventListener("paste", e => { const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6); if (d.length) { e.preventDefault(); d.split("").forEach((c, k) => ins[k] && (ins[k].value = c)); ins[Math.min(5, d.length)].focus(); if (d.length === 6) $("#vf").click(); } });
  });
  let left = 60; const rs = $("#rs"); const tick = () => { rs.textContent = left > 0 ? t("resend_in", { s: left }) : t("resend"); rs.disabled = left > 0; rs.style.color = left > 0 ? "var(--dim)" : "var(--text)"; left--; if (left < -1) clearInterval(otpTimer); };
  tick(); otpTimer = setInterval(tick, 1000);
  rs.onclick = async () => { try { await Auth.phoneOtp(phone); left = 60; clearInterval(otpTimer); tick(); otpTimer = setInterval(tick, 1000); toast(t("code_sent") + " " + phone); } catch (e) { $("#authErr").textContent = authErr(e); } };
  $("#ch").onclick = $("#bk").onclick = () => showAuth("phone", { phone });
  $("#vf").onclick = async () => { const code = ins.map(x => x.value).join(""); if (!/^\d{6}$/.test(code)) return ($("#authErr").textContent = t("err_code")); const b = $("#vf"); btnLoading(b, true);
    try { await Auth.verifyPhone(phone, code); } catch (e) { $("#authErr").textContent = authErr(e); ins.forEach(x => x.value = ""); ins[0].focus(); $("#otp").animate([{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "translateX(0)" }], { duration: 300 }); } finally { if (b.isConnected) btnLoading(b, false); } };
}

function showOnboarding(){
  $("#auth").classList.add("hidden"); $("#app").classList.add("hidden"); const root = $("#onboard"); root.classList.remove("hidden");
  const me = S.me; const st = { step: 0, goal: me.goal || "fit", sex: me.sex || "m", age: me.age || "", height_cm: me.height_cm || "", weight_kg: me.weight_kg || "", activity: me.activity || 1.45,

    const steps = `<div class="ob-steps">${[0, 1, 2].map(i => `<i class="${i <= st.step ? "on" : ""}"></i>`).join("")}</div>`;
    let body = "";
    if (st.step === 0) body = `<div class="ob-title">${t("ob_1t")}</div><p class="ob-sub">${t("ob_1s")}</p><div class="ob-grid">${[["lose", "🔥"], ["gain", "💪"], ["fit", "⚡"], ["strength", "🏋️"]].map(([g, em]) => `<button class="ob-opt ${st.goal === g ? "on" : ""}" data-goal="${g}"><span class="em">${em}</span><b>${t("g_" + g)}</b><span>${t("g_" + g + "_s")}</span></button>`).join("")}</div>`;
    if (st.step === 1) body = `<div class="ob-title">${t("ob_2t")}</div><p class="ob-sub">${t("ob_2s")}</p>
      <div class="field"><label>${t("sex")}</label><div class="seg" id="sexSeg"><button class="${st.sex === "m" ? "on" : ""}" data-v="m">${t("male")}</button><button class="${st.sex === "f" ? "on" : ""}" data-v="f">${t("female")}</button></div></div>
      <div class="input-row"><div class="field"><label>${t("age")}</label><input class="input" id="age" inputmode="numeric" value="${esc(st.age)}" placeholder="27"></div>
      <div class="field"><label>${t("height")}</label><input class="input" id="height" inputmode="decimal" value="${esc(st.height_cm)}" placeholder="178"></div>
      <div class="field"><label>${t("weight")}</label><input class="input" id="weight" inputmode="decimal" value="${esc(st.weight_kg)}" placeholder="75"></div></div>
      <div class="field"><label>${t("activity")}</label><select class="select" id="act">${[[1.2, "act_1"], [1.375, "act_2"], [1.55, "act_3"], [1.725, "act_4"]].map(([v, k]) => `<option value="${v}" ${Math.abs(st.activity - v) < .1 ? "selected" : ""}>${t(k)}</option>`).join("")}</select></div>
      <div class="err" id="obErr"></div>`;
    if (st.step === 2) body = `<div class="ob-title">${t("ob_3t")}</div><p class="ob-sub">${t("ob_3s")}</p>
      <div class="avatar-pick"><div id="obAv">${avatar({ ...me, ...st }, "lg")}</div><button class="btn btn-ghost btn-sm" id="obPic">${icon("camera")}${t("change")}</button></div>
      <div class="field"><label>${t("name")}</label><input class="input" id="fn" value="${esc(st.full_name)}" maxlength="60"></div>
      <div class="field"><label>${t("username")}</label><input class="input" id="un" value="${esc(st.username)}" maxlength="24" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label>${t("bio")}</label><textarea class="textarea" id="bio" maxlength="300" placeholder="${t("bio_ph")}" style="min-height:80px">${esc(st.bio)}</textarea></div>
      <div class="err" id="obErr"></div>`;
    root.innerHTML = `<div class="ob-box">${steps}<div style="animation:fadeup .6s var(--out)">${body}</div>
      <div class="ob-nav">${st.step ? `<button class="btn btn-ghost" id="obBack">${t("back")}</button>` : `<span></span>`}<button class="btn btn-white" id="obNext" style="min-width:140px">${st.step === 2 ? t("done") : t("next")}</button></div></div>`;
    $$("[data-goal]", root).forEach(b => b.onclick = () => { st.goal = b.dataset.goal; draw(); });
    $$("#sexSeg button", root).forEach(b => b.onclick = () => { st.sex = b.dataset.v; $$("#sexSeg button").forEach(x => x.classList.toggle("on", x === b)); });
    const ob = $("#obBack"); if (ob) ob.onclick = () => { collect(); st.step--; draw(); };
    const pic = $("#obPic"); if (pic) pic.onclick = async () => { const f = await pickFile(); if (!f) return; try { btnLoading(pic, true); st.avatar_url = await API.uploadImage(f); $("#obAv").innerHTML = avatar({ ...me, ...st }, "lg"); } catch (e) { toast(e.message, "err"); } finally { btnLoading(pic, false); } };
    const un = $("#un"); if (un) un.oninput = () => { un.value = un.value.toLowerCase().replace(/[^a-z0-9_.]/g, ""); };
    $("#obNext").onclick = next;
  };

function skeletonPosts(n = 4){ return Array.from({ length: n }, () => `<div class="skel-post"><div class="skel" style="width:44px;height:44px;border-radius:50%"></div><div><div class="skel" style="height:14px;width:30%;margin-bottom:10px"></div><div class="skel" style="height:12px;width:92%;margin-bottom:7px"></div><div class="skel" style="height:12px;width:70%"></div></div></div>`).join(""); }
function refreshPostEl(p){ $$(`[data-post="${CSS.escape(p.id)}"]`).forEach(el => { const keepLine = el.classList.contains("is-parent"); const tmp = document.createElement("div"); tmp.innerHTML = postHTML({ ...p, repostedBy: POSTS.get(p.id)?.repostedBy }, { line: keepLine, detail: el.querySelector(".post-meta") != null }); const n = tmp.firstElementChild; n.style.animation = "none"; el.replaceWith(n); }); }

document.addEventListener("click", async e => {

    if (act === "share") { const url = location.origin + location.pathname + "#/post/" + p.id; if (navigator.share && matchMedia("(pointer:coarse)").matches) { try { await navigator.share({ title: "FORMA", text: p.content.slice(0, 100), url }); } catch {} } else { await copyText(url); toast(t("link_copied")); } }
    if (act === "save") { const np = await API.toggleSave(p); POSTS.set(p.id, np); refreshPostEl(np); toast(np.saved ? t("saved") : t("unsave")); }
    if (act === "img") { const src = $("img", actEl).src; const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = `<img src="${esc(src)}" alt="">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); }
    if (act === "more") { const mine = p.author_id === S.me.id; openMenu(actEl, [
      { icon: "link", label: t("copy_link"), run: async () => { await copyText(location.origin + location.pathname + "#/post/" + p.id); toast(t("link_copied")); } },
      { icon: p.saved ? "bookmarkF" : "bookmark", label: p.saved ? t("unsave") : t("save"), run: async () => { const np = await API.toggleSave(p); POSTS.set(p.id, np); refreshPostEl(np); } },
      !mine && { icon: "user", label: t("view_profile"), run: () => go("/u/" + p.author.username) },
      mine ? { icon: "trash", label: t("delete"), danger: true, run: async () => { if (!(await confirmDialog(t("del_confirm"), t("del_yes"), true))) return; try { await API.deletePost(p.id); $$(`[data-post="${CSS.escape(p.id)}"]`).forEach(el => { el.style.cssText = "transition:all .35s var(--out);opacity:0;transform:translateX(-20px)"; setTimeout(() => el.remove(), 350); }); POSTS.delete(p.id); toast(t("deleted")); if (S.route.name === "post" && S.route.params.id === p.id) history.back(); } catch (er) { toast(er.message, "err"); } } }
           : { icon: "flag", label: t("report"), danger: true, run: () => toast(t("reported")) },
    ]); }
  } catch (er) { toast(er.message || t("err_generic"), "err"); }
});

/* ------------------------------ composer ------------------------------ */
function openComposer({ parent = null, quote = null } = {}){
  const draftKey = "forma_draft_" + (parent ? "r" + parent.id : quote ? "q" + quote.id : "new");
  let image = null, tag = null, sending = false;
  const ctx = parent ? `<div class="post is-parent" style="cursor:default;animation:none;padding-top:0"><div class="lane">${avatar(parent.author)}<div class="thread-line"></div></div><div><div class="post-head"><span class="name">${esc(parent.author.username)}</span><span class="time">${timeAgo(parent.created_at)}</span></div><div class="post-body">${linkify(parent.content.length > 280 ? parent.content.slice(0, 280) + "…" : parent.content)}</div></div></div>` : "";
  const m = openModal({ title: parent ? t("reply") : t("new_thread"), body: `${ctx}
    <div class="compose">${avatar(S.me)}<div style="min-width:0"><div class="post-head"><span class="name">${esc(S.me.username)}</span></div>
      <textarea id="cText" placeholder="${parent ? t("reply_to") + " @" + esc(parent.author.username) + "…" : t("whats_new")}" maxlength="${CONFIG.POST_MAX + 50}" rows="3" autofocus></textarea>
      <div id="cImg"></div>
      ${quote ? `<div class="quote"><div class="post-head">${avatar(quote.author, "xs")}<span class="name">${esc(quote.author.username)}</span></div><div class="post-body" style="font-size:14px">${linkify(quote.content.slice(0, 200))}</div></div>` : ""}
      ${parent ? "" : `<div class="chips" id="cTags" style="margin-top:12px">${TAGS.map(k => `<button class="chip" data-ctag="${k}">${t("tag_" + k)}</button>`).join("")}</div>`}
      <div class="compose-tools"><button class="icon-btn" id="cPic" aria-label="${t("add_photo")}">${icon("image")}</button><span class="counter" id="cCount">${CONFIG.POST_MAX}</span></div></div></div>`,
    foot: `<span style="color:var(--dim);font-size:13px;margin-right:auto;align-self:center" class="desk-only">Ctrl + Enter</span><button class="btn btn-white" id="cSend" disabled>${parent ? t("reply") : t("post")}</button>`,
    onClose: () => { const v = $("#cText") && $("#cText").value; if (v && v.trim() && !sending) localStorage.setItem(draftKey, v); else localStorage.removeItem(draftKey); } });
  const ta = $("#cText", m.el), cnt = $("#cCount", m.el), send = $("#cSend", m.el);
  ta.value = localStorage.getItem(draftKey) || "";
  const upd = () => { const left = CONFIG.POST_MAX - ta.value.length; cnt.textContent = left; cnt.className = "counter" + (left < 0 ? " over" : left < 40 ? " warn" : ""); send.disabled = (!ta.value.trim() && !image) || left < 0; ta.style.height = "auto"; ta.style.height = Math.min(360, ta.scrollHeight) + "px"; };
  ta.addEventListener("input", upd); upd();
  ta.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !send.disabled) send.click(); });
  $$("[data-ctag]", m.el).forEach(b => b.onclick = () => { tag = tag === b.dataset.ctag ? null : b.dataset.ctag; $$("[data-ctag]", m.el).forEach(x => x.classList.toggle("on", x.dataset.ctag === tag)); });
  $("#cPic", m.el).onclick = async () => { const f = await pickFile(); if (!f) return; try { image = await compressImage(f); $("#cImg", m.el).innerHTML = `<div class="img-prev"><img src="${image.dataUrl}" alt=""><button aria-label="${t("remove")}">${icon("close")}</button></div>`; $("#cImg button", m.el).onclick = () => { image = null; $("#cImg", m.el).innerHTML = ""; upd(); }; upd(); } catch (e) { toast(e.message, "err"); } };
  send.onclick = async () => {
    const content = ta.value.trim() || (image ? "📸" : ""); if (!content) return toast(t("empty_text"), "err"); if (content.length > CONFIG.POST_MAX) return toast(t("too_long"), "err");
    if (!throttleAction("post", 2500)) return toast(t("rate_limit"), "err");
    sending = true; btnLoading(send, true);
    try { const p = await API.createPost({ content, tag, parent_id: parent ? parent.id : null, quote_id: quote ? quote.id : null, image });
      localStorage.removeItem(draftKey); m.close(); toast(t("posted")); haptic(12);
      if (parent) { const old = POSTS.get(parent.id); if (old) { const np = { ...old, replies_count: old.replies_count + 1 }; POSTS.set(np.id, np); refreshPostEl(np); } if (S.route.name === "post") route(); }
      else if (S.route.name === "feed") { const list = $("#feedList"); if (list) { $(".empty", list)?.remove(); list.insertAdjacentHTML("afterbegin", postHTML(p)); } }
      else if (S.route.name === "profile" && S.route.params.username === S.me.username) route();
    } catch (e) { sending = false; toast(e.message || t("err_generic"), "err"); btnLoading(send, false); }
  };
}

/* ------------------------------ guided session ------------------------------ */
function startSession(plan, day){
  const queue = []; day.items.forEach(it => { for (let s = 1; s <= (+it.sets || 1); s++) queue.push({ it, set: s, of: +it.sets || 1 }); });
  if (!queue.length) return;
  const el = document.createElement("div"); el.className = "session"; document.body.appendChild(el);
  let idx = 0, phase = "work", rest = 90, left = 0, paused = false, t0 = Date.now(), cueI = 0, timer = null, stopCv = null, wakeLock = null;
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wakeLock = w).catch(() => {}); } catch {}
  const done = new Map();
  const close = () => { clearInterval(timer); stopCv && stopCv(); try { wakeLock && wakeLock.release(); } catch {} el.style.animation = "fadeout .3s var(--out) forwards"; setTimeout(() => el.remove(), 300); };
  const beep = (f = 880, ms = 140) => { try { const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)()); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + ms / 1000); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + ms / 1000); } catch {} };
  const finish = async () => {
    clearInterval(timer); const secs = Math.round((Date.now() - t0) / 1000);
    const exercises = [...done.entries()].map(([name, sets]) => ({ exercise: name, sets }));
    el.innerHTML = `<div class="stage"><canvas id="sCv"></canvas><div class="hero-num" style="font-size:clamp(56px,12vw,120px)">${t("session_done")}</div><div style="color:var(--muted);font-size:18px">${Math.round(secs / 60)} ${LANG === "en" ? "min" : "мин"} · ${exercises.reduce((a, e) => a + e.sets, 0)} ${LANG === "en" ? "sets" : "подходов"}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn btn-white" id="sPost">${icon("send", 'style="width:17px;height:17px"')}${LANG === "en" ? "Share to feed" : "Поделиться в ленте"}</button><button class="btn btn-ghost" id="sClose">${t("close")}</button></div></div>`;
    stopCv && stopCv(); stopCv = pulseCanvas($("#sCv", el), { speed: 1.4, amp: 1.2 });
    if (exercises.length) try { await API.logWorkout({ plan_id: plan.id, title: `${plan.title} · ${day.name}`, exercises, duration_sec: secs }); toast(t("session_logged")); } catch (e) { toast(e.message, "err"); }
    $("#sClose", el).onclick = () => { close(); if (S.route.name === "train") route(); };
    $("#sPost", el).onclick = () => { close(); openComposerPrefilled(`${LANG === "en" ? "Workout done" : "Тренировка сделана"} 💪 ${plan.title} · ${day.name}\n${exercises.map(e => `• ${e.exercise} ${e.sets}×`).join("\n")}\n⏱ ${Math.round(secs / 60)} ${LANG === "en" ? "min" : "мин"} #forma`, "win"); };
  };
  const draw = () => {
    const cur = queue[idx]; const e = exById(cur.it.exercise); const cues = e ? (e.cues[LANG] || e.cues.ru) : [];
    const nextQ = queue[idx + 1];
    el.innerHTML = `<div class="stage"><canvas id="sCv"></canvas>
      <div style="position:absolute;top:calc(16px + var(--safe-t));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center"><button class="icon-btn" id="sX" aria-label="${t("close")}">${icon("close")}</button><span style="font-family:var(--f-mono);color:var(--muted);font-size:14px" id="sClock">00:00</span><button class="icon-btn" id="sP" aria-label="${t("pause")}">${icon(paused ? "play" : "pause")}</button></div>
      ${phase === "work" ? `<div class="what">${esc(itemName(cur.it))}<small>${t("set")} ${cur.set} ${t("of")} ${cur.of} · ${esc(cur.it.reps)} ${t("reps")}</small></div>
        <div class="timer">${esc(String(cur.it.reps).split(/[–-]/).pop())}</div><div class="cue-big" id="sCue">${cues.length ? esc(cues[cueI % cues.length]) : ""}</div>`
      : `<div class="what" style="color:var(--muted)">${t("session_rest")}<small>${nextQ ? t("session_next") + ": " + esc(itemName(nextQ.it)) + " · " + t("set") + " " + nextQ.set : ""}</small></div>
        <div class="timer rest" id="sRest">${left}</div><div style="display:flex;gap:8px"><button class="btn btn-dark btn-sm" data-adj="-15">−15</button><button class="btn btn-dark btn-sm" data-adj="15">+15</button></div>`}</div>
      <div class="session-ui"><div class="session-progress"><i style="width:${(idx / queue.length) * 100}%"></i></div>
        <div class="session-row"><span style="color:var(--muted);font-size:14px">${idx + 1} / ${queue.length}</span>
          <div style="display:flex;gap:8px">${phase === "work" ? `<button class="btn btn-white" id="sDone" style="min-width:170px">${icon("check", 'style="width:18px;height:18px"')}${LANG === "en" ? "Set done" : "Подход выполнен"}</button>` : `<button class="btn btn-white" id="sSkip" style="min-width:170px">${icon("skip", 'style="width:16px;height:16px"')}${t("session_next")}</button>`}<button class="btn btn-ghost" id="sEnd">${t("session_finish")}</button></div></div></div>`;
    stopCv && stopCv(); stopCv = pulseCanvas($("#sCv", el), { speed: phase === "work" ? 1.2 : .5, amp: phase === "work" ? 1 : .5, color: phase === "work" ? "244,244,242" : "63,214,232" });
    $("#sX", el).onclick = async () => { if (await confirmDialog(LANG === "en" ? "Quit the workout? Progress won't be saved." : "Выйти? Прогресс не сохранится.", LANG === "en" ? "Quit" : "Выйти", true)) close(); };
    $("#sP", el).onclick = () => { paused = !paused; $("#sP", el).innerHTML = icon(paused ? "play" : "pause"); };
    $("#sEnd", el).onclick = finish;
    const dn = $("#sDone", el); if (dn) dn.onclick = () => { haptic(15); beep(660); const name = itemName(cur.it); done.set(name, (done.get(name) || 0) + 1); if (idx >= queue.length - 1) return finish(); phase = "rest"; left = rest; draw(); };
    const sk = $("#sSkip", el); if (sk) sk.onclick = () => { idx++; phase = "work"; cueI = 0; draw(); };
    $$("[data-adj]", el).forEach(b => b.onclick = () => { left = clamp(left + +b.dataset.adj, 5, 600); rest = clamp(rest + +b.dataset.adj, 15, 600); $("#sRest", el).textContent = left; });
  };
  timer = setInterval(() => {
    const secs = Math.floor((Date.now() - t0) / 1000); const c = $("#sClock", el); if (c) c.textContent = `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")}`;
    if (paused) return;
    if (phase === "rest") { left--; const r = $("#sRest", el); if (r) r.textContent = Math.max(0, left); if (left <= 3 && left > 0) beep(520, 90); if (left <= 0) { beep(990, 260); haptic(40); idx++; phase = "work"; cueI = 0; draw(); } }
    else if (secs % 6 === 0) { cueI++; const cu = $("#sCue", el); const e = exById(queue[idx].it.exercise); if (cu && e) { const cs = e.cues[LANG] || e.cues.ru; cu.style.animation = "none"; void cu.offsetWidth; cu.style.animation = ""; cu.textContent = cs[cueI % cs.length]; } }
  }, 1000);
  draw();
}

const extOf = (name, mime) => { const e = String(name || "").split(/[?#]/)[0].split(".").pop(); if (e && e.length <= 5 && e !== name) return e.toUpperCase(); if (mime) return (mime.split("/")[1] || "FILE").slice(0, 4).toUpperCase(); return "FILE"; };

function videoThumb(file){
  return new Promise(res => {

    const end = b => { if (settled) return; settled = true; URL.revokeObjectURL(url); res(b); };

    v.onerror = () => end(null); setTimeout(() => end(null), 8000);
  });
}

function matCardHTML(m, i){

}
async function signOut(){
  clearInterval(unreadTimer); unsubApp && unsubApp(); unsubApp = null; S.cleanup.splice(0).forEach(f => { try { f(); } catch {} });
  if (S.mode === "live") { Remote.teardown(); await Auth.signOut().catch(() => {}); }
  localStorage.removeItem("forma_mode"); S.me = null; S.unreadDm = S.unreadNotif = 0; API = Local; location.hash = "";
  $("#view").innerHTML = ""; $("#side").innerHTML = ""; showAuth();
}
function hideSplash(){ const s = $("#splash"); if (s && !s.classList.contains("out")) { s.classList.add("out"); setTimeout(() => s.remove(), 800); } }
function installManifest(){
  try { const icon512 = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0a0a0b"/><path d="M64 280h88l40-104 72 208 56-152 40 48h88" fill="none" stroke="#f4f4f2" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
    const man = { name: "FORMA", short_name: "FORMA", start_url: location.pathname, display: "standalone", background_color: "#0a0a0b", theme_color: "#0a0a0b", orientation: "portrait", icons: [{ src: icon512, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }] };
    const l = document.createElement("link"); l.rel = "manifest"; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: "application/manifest+json" })); document.head.appendChild(l);
    const ai = document.createElement("link"); ai.rel = "apple-touch-icon"; ai.href = icon512; document.head.appendChild(ai); } catch {}
}
addEventListener("online", () => toast(LANG === "en" ? "Back online" : "Снова онлайн"));
addEventListener("offline", () => toast(t("offline"), "err", 4000));
addEventListener("unhandledrejection", e => { console.warn("unhandled", e.reason); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me) refreshUnread(); });

(async function boot(){
  setLang(LANG); installManifest();
  const started = Date.now();
  const session = await Auth.boot();
  const wait = () => sleep(Math.max(0, 1100 - (Date.now() - started)));
  if (Auth.ready) sb.auth.onAuthStateChange((ev, sess) => {
    if (ev === "SIGNED_IN" && sess && (!S.me || S.mode !== "live")) startLive(sess);
    if (ev === "SIGNED_OUT" && S.mode === "live" && S.me) { S.me = null; showAuth(); }
    if (ev === "PASSWORD_RECOVERY") setTimeout(async () => { const v = prompt(LANG === "en" ? "New password (min 8 chars, letter + digit)" : "Новый пароль (мин. 8 символов, буква и цифра)"); if (v && v.length >= 8) { const { error } = await sb.auth.updateUser({ password: v }); toast(error ? authErr(error) : (LANG === "en" ? "Password updated" : "Пароль обновлён"), error ? "err" : "ok"); } }, 300);
  });
  await wait();
  if (session) return startLive(session);
  if (localStorage.getItem("forma_mode") === "demo") return startDemo();
  hideSplash(); showAuth();
})();
</script>
